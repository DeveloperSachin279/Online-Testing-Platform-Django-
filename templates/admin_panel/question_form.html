{% extends "admin_panel/admin_base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<a href="#" onclick="history.back(); return false;" style="display:inline-flex; align-items:center; gap:0.5rem; margin-bottom:1.5rem; color:var(--text-muted); font-size:0.95rem; font-weight:600; text-decoration:none; transition:var(--transition);" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-muted)'">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    Go Back
</a>

<div class="card" style="max-width:700px; margin:0 auto; padding:2.5rem; box-shadow:var(--shadow-md);">
    <div style="display:flex; align-items:center; gap:1rem; margin-bottom:2rem; border-bottom:1px solid var(--border); padding-bottom:1rem;">
        <div style="width:48px; height:48px; background:var(--primary-light); color:var(--primary); border-radius:12px; display:flex; align-items:center; justify-content:center;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        </div>
        <div>
            <h2 style="margin:0; font-size:1.5rem; font-weight:800; color:var(--text-main);">{{ title }}</h2>
            <p style="margin:0; font-size:0.9rem; color:var(--text-muted); margin-top:0.25rem;">Fill out the information below.</p>
        </div>
    </div>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div style="margin-top:2.5rem; display:flex; justify-content:flex-end; gap:1rem; border-top:1px solid var(--border); padding-top:1.5rem;">
            <button type="button" onclick="history.back()" class="btn btn-outline" style="padding:0.75rem 1.5rem;">Cancel</button>
            <button type="submit" class="btn btn-primary" style="padding:0.75rem 2rem; background:linear-gradient(to right, #4f46e5, #3b82f6); box-shadow:0 4px 14px rgba(79,70,229,0.3); border:none;">Save Changes</button>
        </div>
    </form>
</div>

<style>
    form p { 
        margin-bottom: 1.25rem; 
        display: flex; 
        flex-direction: column; 
    }
    form label { 
        margin-bottom: 0.5rem; 
        font-weight: 600; 
        font-size: 0.9rem; 
        color: var(--text-main);
    }
    form input[type="text"], 
    form input[type="email"], 
    form input[type="password"], 
    form input[type="number"], 
    form select, 
    form textarea {
        padding: 0.75rem 1rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 0.95rem;
        font-family: inherit;
        background-color: var(--surface);
        transition: var(--transition);
        color: var(--text-main);
        width: 100%;
        box-sizing: border-box;
    }
    form input[type="text"]:focus, 
    form input[type="email"]:focus, 
    form input[type="password"]:focus, 
    form input[type="number"]:focus, 
    form select:focus, 
    form textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        background-color: white;
    }
    form textarea {
        min-height: 120px;
        resize: vertical;
    }
    form input[type="checkbox"] {
        width: 1.1rem;
        height: 1.1rem;
        accent-color: var(--primary);
        margin-top: 0.5rem;
        cursor: pointer;
    }
    .helptext { 
        font-size: 0.8rem; 
        color: var(--text-muted); 
        margin-top: 0.4rem; 
    }
    .errorlist {
        color: var(--danger);
        font-size: 0.85rem;
        list-style: none;
        padding: 0;
        margin: 0.25rem 0 0 0;
    }
</style>
{% endblock %}
