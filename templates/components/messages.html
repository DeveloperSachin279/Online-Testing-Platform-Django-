
{% if messages %}
<div class="messages-container" style="max-width: 600px; margin: 1rem auto; padding: 0 1rem;">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }}" style="cursor:pointer;" title="Click to dismiss">
        <span>{{ message }}</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </div>
    {% endfor %}
</div>
{% endif %}
